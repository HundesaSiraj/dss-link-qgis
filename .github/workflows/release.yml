name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check tag matches metadata version
        run: |
          version=$(grep '^version=' dss_link/metadata.txt | cut -d= -f2)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != metadata v$version"; exit 1; }
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build plugin zip
        run: python scripts/build_zip.py
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          make_latest: true
          generate_release_notes: true
