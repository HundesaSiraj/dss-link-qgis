name: tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (QGIS-independent code)
        run: python -m unittest discover -s tests -v
      - name: Byte-compile the plugin
        run: python -m compileall -q dss_link
      - name: Build plugin zip
        run: python scripts/build_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: dss_link-plugin-zip
          path: dist/*.zip
